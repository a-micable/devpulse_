[metadata]
name = devpulse
version = 1.0.0

[options]
packages = find:
python_requires = >=3.10
install_requires =
    aiohttp>=3.9
    aiohttp-cors>=0.7
    watchdog>=4.0
    GitPython>=3.1

[options.entry_points]
console_scripts =
    devpulse = devpulse.cli.__main__:main

[options.extras_require]
toml =
    tomli>=2.0; python_version < "3.11"
dev =
    pytest>=8
    pytest-asyncio>=0.23
    pytest-cov>=5
    ruff>=0.4
    mypy>=1.10