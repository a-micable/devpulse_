[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "devpulse"
version     = "1.0.0"
description = "Developer activity tracker — sessions, git analysis, and reporting"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"

authors = [
  { name = "devpulse contributors" },
]

keywords = ["developer-tools", "git", "productivity", "tracking"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Utilities",
]

dependencies = [
  "aiohttp>=3.9",
  "aiohttp-cors>=0.7",
  "watchdog>=4.0",
  "GitPython>=3.1",
]

[project.optional-dependencies]
toml = ["tomli>=2.0; python_version < '3.11'"]
dev  = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
devpulse = "devpulse.cli.__main__:main"

[project.urls]
Repository = "https://github.com/your-org/devpulse"

[tool.setuptools.packages.find]
where   = ["."]
include = ["devpulse*"]

[tool.setuptools.package-data]
"devpulse.web" = ["**/*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.isort]
known-first-party = ["devpulse"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode  = "auto"
testpaths     = ["devpulse/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version         = "3.10"
strict                 = false
ignore_missing_imports = true